name: CD — Deploy to Production

on:
  workflow_run:
    workflows: ["CI- Build & Push Docker Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"

      - name: Wait for Render deploy to complete
        run: |
          echo " Waiting for Render to spin up..."
          sleep 30

      - name: Health check — Backend
        run: |
          echo "Waiting for backend to be healthy at ${{ secrets.BACKEND_URL }}..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health)
            if [ "$STATUS" == "200" ]; then
              echo "Backend is live!"
              exit 0
            fi
            echo "Attempt $i: Backend health check returned $STATUS. Retrying in 20s..."
            sleep 20
          done
          echo "Backend health check failed after multiple attempts."
          exit 1

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BUN_PUBLIC_SUPABASE_URL: ${{ secrets.BUN_PUBLIC_SUPABASE_URL }}
      BUN_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BUN_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      BUN_PUBLIC_BACKEND_URL: ${{ secrets.BACKEND_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Install dependencies
        run: bun install
        working-directory: ./frontend

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

      - name: Build project with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          # Use --yes to skip confirmation and --cwd to ensure correct directory
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --cwd ./frontend)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV

      - name: Health check — Frontend
        run: |
          echo "Checking $DEPLOY_URL"
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $DEPLOY_URL)
            if [ "$STATUS" == "200" ]; then
              echo "Frontend is live!"
              exit 0
            fi
            echo "Attempt $i: Frontend health check returned $STATUS. Retrying in 10s..."
            sleep 10
          done
          echo "Frontend health check failed after multiple attempts."
          exit 1

  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Print deployment result
        run: |
          echo "==============================="
          echo " DEPLOYMENT SUMMARY"
          echo "==============================="
          echo "Backend  → ${{ needs.deploy-backend.result }}"
          echo "Frontend → ${{ needs.deploy-frontend.result }}"
          echo "==============================="