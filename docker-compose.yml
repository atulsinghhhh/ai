version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astra-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
